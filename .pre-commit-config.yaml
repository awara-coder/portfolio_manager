repos:
  - repo: local
    hooks:
      - id: architecture-boundaries
        name: architecture boundaries
        entry: python3 scripts/check_architecture.py --root .
        language: system
        pass_filenames: false
        always_run: true
      - id: python-fast-checks
        name: Python fast checks
        entry: uv run ruff check .
        language: system
        pass_filenames: false
      - id: python-format
        name: Python format
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
