[project]
name = "portfolio-manager-worker"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = [
  "portfolio-manager-analytics",
  "portfolio-manager-application",
  "portfolio-manager-connectors",
  "portfolio-manager-domain",
  "portfolio-manager-jobs",
  "portfolio-manager-observability",
  "portfolio-manager-persistence",
  "portfolio-manager-reporting",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "portfolio_manager.apps.worker"
