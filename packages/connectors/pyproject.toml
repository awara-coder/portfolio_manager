[project]
name = "portfolio-manager-connectors"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = [
  "httpx>=0.28,<0.29",
  "portfolio-manager-application",
  "portfolio-manager-domain",
  "pydantic>=2.12,<3",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "portfolio_manager.connectors"
