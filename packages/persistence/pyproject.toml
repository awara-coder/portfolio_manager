[project]
name = "portfolio-manager-persistence"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "cryptography>=46.0,<47",
  "portfolio-manager-application",
  "portfolio-manager-domain",
  "sqlalchemy>=2.0,<3",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "portfolio_manager.persistence"
