name: Feature request
description: Propose a scoped improvement or integration.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user need is not currently met?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe behavior, not a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Data, security, or broker constraints
      description: Identify permissions, external data, compatibility, or approval gates.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request does not include credentials or private financial data.
          required: true
        - label: I understand trading and automated broker login are outside the current scope.
          required: true
