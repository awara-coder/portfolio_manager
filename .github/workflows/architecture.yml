name: Architecture boundaries

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Enforce module boundaries
        run: python3 scripts/check_architecture.py --root .
      - name: Test architecture enforcement
        run: python3 -m unittest discover -s tests/governance -p 'test_*.py'
