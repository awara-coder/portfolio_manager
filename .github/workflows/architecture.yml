name: Architecture boundaries

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enforce module boundaries
        run: python3 scripts/check_architecture.py --root .
      - name: Test architecture enforcement
        run: python3 -m unittest discover -s tests/governance -p 'test_*.py'
