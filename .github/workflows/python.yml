name: Python

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.1
      - name: Install locked workspace
        run: uv sync --all-packages --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Enforce imports
        run: uv run lint-imports
      - name: Test
        run: uv run pytest
      - name: Enforce Zerodha connector coverage
        run: >-
          uv run pytest tests/connectors
          --cov=portfolio_manager.connectors.zerodha
          --cov=portfolio_manager.connectors.zerodha_auth
          --cov=portfolio_manager.connectors.zerodha_http
          --cov-branch
          --cov-report=term-missing
      - name: Build packages
        run: uv build --all-packages
